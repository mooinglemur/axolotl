<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Axolotl Stats</title>
    <link rel="stylesheet" href="stats.css">
</head>

<body>
    <div id="stats-container">
        <div id="my-slots" class="section"></div>
        <div id="overall" class="section"></div>
        <div id="notable" class="section"></div>
        <div id="unified" class="section"></div>
        <div id="waiting" class="section">
            <div class="waiting-anim">
                <span class="dot trail trail-4"></span>
                <span class="dot trail trail-3"></span>
                <span class="dot trail trail-2"></span>
                <span class="dot trail trail-1"></span>
                <span class="dot dot-main"></span>
            </div>
        </div>
        <div id="goal-popup" class="section">
            <div class="fireworks"></div>
            <div class="sparkles"></div>
            <div class="goal-text">
                <span class="goal-name"></span>
                <span class="goal-suffix"> reached the goal</span>
                <span class="goal-game-prefix"> in </span>
                <span class="goal-game"></span><span class="goal-bang">!</span>
            </div>
        </div>
    </div>
    <script src="stats.js"></script>
</body>

</html>
